apiVersion: v1
kind: Secret
metadata:
  name: trade-docs-secrets
  namespace: trade-docs-platform
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  REDIS_PASSWORD: ""  # echo -n "your-redis-password" | base64
  MONGO_ROOT_USERNAME: "YWRtaW4="  # admin
  MONGO_ROOT_PASSWORD: "cGFzc3dvcmQ="  # password
  MONGO_DATABASE: "dHJhZGVkb2Nz"  # tradedocs
  # Full MongoDB connection string including credentials
  # Example (do NOT commit real passwords): echo -n "mongodb://admin:password@mongodb-service:27017/tradedocs?authSource=admin" | base64
  MONGODB_URI: ""
  
  # JWT Configuration
  JWT_SECRET_KEY: ""  # echo -n "your-jwt-secret" | base64
  REFRESH_TOKEN_SECRET: ""  # echo -n "your-refresh-secret" | base64
  
  # External Services
  BREVO_API_KEY: ""  # echo -n "your-brevo-api-key" | base64
  BREVO_SENDER_EMAIL: ""  # echo -n "noreply@yourdomain.com" | base64
  BREVO_SENDER_NAME: ""  # echo -n "Trade Docs Platform" | base64
  
  # Blockchain Configuration
  TOKEN_REGISTRY_ADDRESS: ""  # echo -n "0x..." | base64
  DOCUMENT_STORE_ADDRESS: ""  # echo -n "0x..." | base64
