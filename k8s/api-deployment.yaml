apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-docs-api
  namespace: trade-docs-platform
  labels:
    app: trade-docs-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trade-docs-api
  template:
    metadata:
      labels:
        app: trade-docs-api
    spec:
      containers:
      - name: api
        image: trade-docs-api:latest
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: trade-docs-config
        - secretRef:
            name: trade-docs-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/healthcheck
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/healthcheck
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/healthcheck
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 10
      imagePullSecrets:
      - name: gcr-json-key
---
apiVersion: v1
kind: Service
metadata:
  name: trade-docs-api-service
  namespace: trade-docs-platform
spec:
  selector:
    app: trade-docs-api
  ports:
  - port: 80
    targetPort: 3001
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trade-docs-api-hpa
  namespace: trade-docs-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trade-docs-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
