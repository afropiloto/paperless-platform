name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '18.x'
  MONGO_VERSION: '6.0'
  REDIS_VERSION: '7.0'

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        test-group: [unit, integration, performance]
    
    services:
      mongodb:
        image: mongo:${{ env.MONGO_VERSION }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:${{ env.REDIS_VERSION }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install -g pnpm
          pnpm install

      - name: Build application
        run: |
          npm run build
          npm run build:test

      - name: Wait for services
        run: |
          npx wait-on tcp:27017 tcp:6379 --timeout 30000

      - name: Run database migrations
        run: npm run migration:run
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/test-db
          REDIS_URL: redis://localhost:6379

      - name: Run unit tests
        if: matrix.test-group == 'unit'
        run: |
          npm run test:e2e -- --testPathPattern="controllers" --maxWorkers=4
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/test-db
          REDIS_URL: redis://localhost:6379
          JEST_VERBOSE: true

      - name: Run integration tests
        if: matrix.test-group == 'integration'
        run: |
          npm run test:e2e -- --testPathPattern="integration" --maxWorkers=2
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/test-db
          REDIS_URL: redis://localhost:6379
          JEST_VERBOSE: true

      - name: Run performance tests
        if: matrix.test-group == 'performance'
        run: |
          npm run test:e2e -- --testPathPattern="performance" --maxWorkers=1
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/test-db
          REDIS_URL: redis://localhost:6379
          JEST_VERBOSE: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.test-group }}
          path: |
            test-results/
            coverage-e2e/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.test-group == 'unit'
        with:
          file: ./coverage-e2e/lcov.info
          flags: e2e
          name: e2e-coverage

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install -g pnpm
          pnpm install

      - name: Run security audit
        run: |
          npm audit --audit-level=moderate
          pnpm audit --audit-level=moderate

      - name: Run dependency check
        run: |
          npx audit-ci --moderate

  performance-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    services:
      mongodb:
        image: mongo:${{ env.MONGO_VERSION }}
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:${{ env.REDIS_VERSION }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install -g pnpm
          pnpm install

      - name: Build application
        run: |
          npm run build
          npm run build:test

      - name: Wait for services
        run: |
          npx wait-on tcp:27017 tcp:6379 --timeout 30000

      - name: Run performance benchmark
        run: |
          npm run test:e2e -- --testPathPattern="performance" --maxWorkers=1 --verbose
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/test-db
          REDIS_URL: redis://localhost:6379
          JEST_VERBOSE: true

      - name: Generate performance report
        run: |
          node scripts/generate-performance-report.js

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: |
            performance-results/
            test-results/
          retention-days: 90

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [e2e-tests, security-tests]
    if: always()
    
    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          path: test-results

      - name: Generate test summary
        run: |
          node scripts/generate-test-summary.js

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('test-summary.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: test-summary.md
          retention-days: 30
