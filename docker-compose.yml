version: '3.8'

services:
  # Redis for queue management
  redis:
    image: redis:7-alpine
    container_name: trade-docs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # Security: Redis password from environment variable (set via .env or command line)
    command: >
      sh -c "
      if [ -n \"$${REDIS_PASSWORD}\" ]; then
        redis-server --appendonly yes --requirepass $${REDIS_PASSWORD}
      else
        redis-server --appendonly yes
      fi
      "
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: >
        sh -c "
        if [ -n \"$${REDIS_PASSWORD}\" ]; then
          redis-cli -a $${REDIS_PASSWORD} ping
        else
          redis-cli ping
        fi
        "
      interval: 10s
      timeout: 3s
      retries: 3

  # MongoDB database
  mongodb:
    image: mongo:7
    container_name: trade-docs-mongodb
    ports:
      - "27017:27017"
    environment:
      # Security: MongoDB credentials from environment variables (set via .env or command line)
      # Defaults provided for development convenience, but should be overridden in production
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-tradedocs}
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Application
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: trade-docs-api
    ports:
      - "3001:3001"
    env_file:
      - env.development
    environment:
      # Security: Build MongoDB URI from environment variables
      - MONGODB_URI=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-password}@mongodb:27017/${MONGO_DATABASE:-tradedocs}?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Worker Application
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: trade-docs-worker
    env_file:
      - env.development
    environment:
      # Security: Build MongoDB URI from environment variables
      - MONGODB_URI=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-password}@mongodb:27017/${MONGO_DATABASE:-tradedocs}?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "main-worker.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Optional: Redis Commander for queue monitoring
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: trade-docs-redis-commander
    ports:
      - "8081:8081"
    environment:
      # Security: Redis connection - password included in REDIS_HOSTS if set
      # Format: name:host:port:passwordIndex:dbIndex:password
      # If REDIS_PASSWORD is empty, password part is omitted
      - REDIS_HOSTS=local:redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - HTTP_USER=${REDIS_COMMANDER_USER:-admin}
      - HTTP_PASSWORD=${REDIS_COMMANDER_PASSWORD:-password}
    depends_on:
      - redis
    profiles:
      - monitoring

  # Optional: Mongo Express for database monitoring
  mongo-express:
    image: mongo-express:latest
    container_name: trade-docs-mongo-express
    ports:
      - "8082:8081"
    environment:
      # Security: Mongo Express credentials from environment variables
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_ROOT_USERNAME:-admin}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASSWORD:-password}
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-password}@mongodb:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USERNAME:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD:-password}
    depends_on:
      - mongodb
    profiles:
      - monitoring

volumes:
  redis_data:
  mongodb_data:

networks:
  default:
    name: trade-docs-network
